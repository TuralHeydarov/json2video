name: PostgreSQL compatibility
on:
  pull_request:
  push:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: rehearsal
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_SCHEMA: json2video
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: rehearsal
      DB_USERNAME: postgres
      DB_PASSWORD: fixture-only
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite
      - run: composer install --no-interaction --prefer-dist
        working-directory: api
      - run: psql -h 127.0.0.1 -U postgres -d rehearsal -c 'CREATE SCHEMA json2video; CREATE SCHEMA json2video_import; CREATE SCHEMA json2video_auth;'
        env:
          PGPASSWORD: fixture-only
      - run: php artisan test --filter=SharedAuthTest
        working-directory: api
        env:
          DB_SCHEMA: json2video_auth
          CACHE_STORE: array
          SESSION_DRIVER: array
      - run: php artisan migrate --force
        working-directory: api
      - run: php artisan migrate --force
        working-directory: api
        env:
          DB_SCHEMA: json2video_import
      - run: |
          psql -h 127.0.0.1 -U postgres -d rehearsal -v ON_ERROR_STOP=1 <<'SQL'
          SET search_path=json2video,pg_catalog;
          INSERT INTO plans (id,name,slug) VALUES (1,'fixture','fixture');
          INSERT INTO users (id,name,email,password,plan_id) VALUES (1,'fixture','fixture@invalid.test','fixture',1);
          INSERT INTO webhook_configs (user_id,url,is_active) VALUES (1,'https://invalid.test/webhook',TRUE);
          SQL
        env:
          PGPASSWORD: fixture-only
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'psycopg[binary]==3.2.13'
      - run: python -m unittest discover -s tests -v
        working-directory: renderer
  offline-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r renderer/requirements.txt
      - run: python tools/render_fixture.py

  release-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: false
          load: true
          tags: json2video-api:${{ github.sha }}
          cache-from: type=gha,scope=json2video-api
          cache-to: type=gha,mode=max,scope=json2video-api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/nginx.Dockerfile
          push: false
          load: true
          tags: json2video-nginx:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: renderer
          file: renderer/Dockerfile
          push: false
          load: true
          tags: json2video-renderer:${{ github.sha }}
          cache-from: type=gha,scope=json2video-renderer
          cache-to: type=gha,mode=max,scope=json2video-renderer
      - run: |
          docker run --rm --network none --entrypoint php json2video-api:${{ github.sha }} -r "if(!extension_loaded('pdo_pgsql'))exit(1);echo 'PostgreSQL runtime ready';"
          docker network create json2video-fixture
          trap 'docker rm -f json2video-api-fixture json2video-nginx-fixture; docker network rm json2video-fixture' EXIT
          docker run -d --network json2video-fixture --network-alias api --name json2video-api-fixture -e APP_ENV=testing -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= -e SESSION_DRIVER=array -e CACHE_STORE=array json2video-api:${{ github.sha }}
          docker run -d --network json2video-fixture --name json2video-nginx-fixture -p 127.0.0.1:43993:80 json2video-nginx:${{ github.sha }}
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:43993/login > fixture-login.html
          grep -q 'Welcome Back' fixture-login.html
          docker run --rm --network none --memory 3g --memory-swap 3g --cpus 2 --entrypoint python json2video-renderer:${{ github.sha }} -c "from faster_whisper import WhisperModel; WhisperModel('large-v3-turbo',device='cpu',compute_type='int8',local_files_only=True);print('Baked offline model ready')"
          docker save json2video-api:${{ github.sha }} json2video-nginx:${{ github.sha }} json2video-renderer:${{ github.sha }} | gzip > json2video-images.tar.gz
          sha256sum json2video-images.tar.gz > json2video-images.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: json2video-images-${{ github.sha }}
          path: |
            json2video-images.tar.gz
            json2video-images.tar.gz.sha256
          retention-days: 1
