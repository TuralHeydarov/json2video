# Run from the repository root. This is target deployment, never source override.
# Keep workers behind the cutover profile until final data synchronization.
name: json2video-rs8000
x-app: &app
  build:
    context: ../api
    dockerfile: Dockerfile
  env_file: ../.env.rs8000
  environment:
    DB_CONNECTION: pgsql
    DB_SCHEMA: json2video
    DB_HOST: mind-supabase-db
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PREFIX: json2video-database-
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    STORAGE_PATH: /var/www/html/storage/renders
  volumes:
    - ../api:/var/www/html
    - ../storage/renders:/var/www/html/storage/renders
  networks: [app, database]
  restart: unless-stopped
  mem_limit: 256m
  cpus: 0.5
services:
  api:
    <<: *app
  queue-worker:
    <<: *app
    profiles: [cutover]
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
  scheduler:
    <<: *app
    profiles: [cutover]
    command: sh -c 'while true; do php artisan schedule:run --no-interaction; sleep 60; done'
  renderer:
    profiles: [cutover]
    build:
      context: ../renderer
    env_file: ../.env.rs8000
    environment:
      DB_CONNECTION: pgsql
      DB_SCHEMA: json2video
      DB_HOST: mind-supabase-db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PREFIX: json2video-database-
      WORKER_CONCURRENCY: 1
      STORAGE_PATH: /app/storage/renders
    volumes:
      - ../storage/renders:/app/storage/renders
      - ../videos:/app/media:ro
    networks: [app, database]
    restart: unless-stopped
    mem_limit: ${JSON2VIDEO_RENDERER_MEMORY:-3g}
    cpus: 2
  nginx:
    image: nginx:1.25-alpine
    ports: ['127.0.0.1:${JSON2VIDEO_PORT:-2993}:80']
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../storage/renders:/var/www/renders:ro
      - ../videos:/var/www/media:ro
      - ../api:/var/www/html:ro
    depends_on: [api]
    networks: [app]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    networks: [app]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
networks:
  app:
  database:
    external: true
    name: mind-supabase_default
volumes:
  redis_data:
